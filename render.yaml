services:
  - type: web
    name: astar-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    ports:
      - port: 10000
        protocol: TCP
    envVars:
      - key: PORT
        value: "10000"
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
